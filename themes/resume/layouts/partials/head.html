<head>
    {{- partial "google.html" . -}}
    {{- partial "security-headers.html" . -}}

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="On this site you can find information about Martin Georgiev's IT projects, approach to solving business problens, architectures.">
    <meta name="author" content="{{ .Site.Params.author}}">
    <meta property="og:title" content="{{ .Site.Title }}" />

    <meta name="description" content="{{ .Site.Params.description }}">

    <title>{{ .Site.Title }}</title>
    <link rel="shortcut icon" href="{{ .Site.Params.favicon }}">
