baseURL = "https://www.martingeorgiev.com/"
languageCode = "en-us"
title = "Martin Georgiev"
theme = "resume"
canonifyURLs = true

[security]
  # Enable Go template sandboxing
  enableInlineShortcodes = false
  [security.gomarkdown]
    allowDangerousAttributes = false
    allowDangerousUrls = false

# ============================================================
# SECURITY: Content-Security-Policy must be set at server/CDN level
# For Azure Static Web Apps: Azure Portal → Configuration → Security headers
# Recommended CSP:
# default-src 'self'; script-src 'self' https://www.googletagmanager.com https://www.google-analytics.com 'unsafe-inline'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://www.google-analytics.com
# ============================================================

[params]
    author = "Martin Georgiev"
    firstName = "Martin"
    lastName = "Georgiev"
	city = "Luxembourg"
	country = "Bulgaria"
    phone = "(359) 89-84-666-89"
    contactNote = "System Designer"
    profileImage = "img/profile.png"
    email = "contact@martingeorgiev.com"
    description = "System designer, former solution architect, former developer. I specialize in decreasing risks associated with migrations to Azure public cloud and lowering IT expenses through application modernization to reliable and secure cloud architectures."
    favicon = "img/favicon.png"
    # what sections
    showHandles = true
    showCompetence = false
    showExperience = true
    showEducation = true
    showSkills = true
    showProjects = true
    showOpenSource = false
    showPublications = false
    showCertificates = true
    showSearch = true
	showBG = false
    showQr = true
    showPrivacy = true

[params.google.analytics]
    trackerID = "G-XXXXXXXXXX"
    # NOTE: Replace G-XXXXXXXXXX with your actual GA4 Measurement ID
    # Migration from Universal Analytics (UA) completed - UA was sunset July 2024

[outputFormats]
  [outputFormats.JSON]
    baseName = "api"
    isPlainText = true
    mediaType = "application/json"

  [outputFormats.healthcheck]
    baseName = "healthcheck"
    isPlainText = true
    mediaType = "application/json"

  [outputFormats.jsonfeed]
    baseName = "feed"
    isPlainText = true
    mediaType = "application/json"

[outputs]
  home = ["HTML", "AMP", "jsonfeed", "healthcheck","json"]
  page = ["HTML", "AMP"]

